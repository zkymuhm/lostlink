{% extends "base.html" %}
{% block body %}
<div class="d-flex">
  <aside class="ll-side">
    <div class="brand">LOSTLINK Admin</div>
    {% for label, url in [("Persetujuan klaim", "/admin/klaim"), ("Semua laporan", "/admin/laporan"), ("Pengguna", "/admin/pengguna")] %}
      <a class="{% if aktif == label %}active{% endif %}" href="{{ url }}">{{ label }}</a>
    {% endfor %}
    <form method="post" action="/logout"><button>Keluar</button></form>
  </aside>
  <main class="flex-grow-1 p-4">{% block content %}{% endblock %}</main>
</div>
{% endblock %}
